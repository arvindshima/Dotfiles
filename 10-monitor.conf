# Generate the modeline first (adjust dimensions/refresh rate as needed)
# cvt 2560 1078 60
# Set the monitor configuration in /etc/X11/xorg.conf.d/10-monitor.conf

Section "Monitor"
    Identifier "Virtual-1"
    Modeline "2560x1078_60.00"  229.50  2560 2720 2992 3424  1078 1081 1091 1118 -hsync +vsync
    Option "PreferredMode" "2560x1078_60.00"
EndSection
